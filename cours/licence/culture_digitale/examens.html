<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Examens</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Segoe UI, Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
        }

        .header {
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
            color: white;
            padding: 35px;
            text-align: center;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: .95;
            font-size: 18px;
        }

        .table-container {
            padding: 30px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f59e0b;
            color: white;
            padding: 18px;
            font-size: 18px;
        }

        td {
            padding: 18px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
            font-size: 17px;
        }

        tr:nth-child(even) {
            background: #fafafa;
        }

        tr:hover {
            background: #fff8eb;
        }

        .btn {
            display: inline-block;
            padding: 10px 22px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: .3s;
        }

        .normal {
            background: #10b981;
        }

        .normal:hover {
            background: #059669;
        }

        .rattrapage {
            background: #ef4444;
        }

        .rattrapage:hover {
            background: #dc2626;
        }

        /* Bouton retour avec dégradé de qualité */
        .btn-retour {
            padding: 14px 35px;
            border-radius: 50px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 16px;
            transition: all .4s ease;
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            letter-spacing: 0.5px;
        }

        .btn-retour:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        .btn-retour:active {
            transform: translateY(0px) scale(0.98);
        }

        .btn-retour i {
            margin-right: 10px;
            font-size: 18px;
        }

        .footer {
            padding: 25px 20px;
            text-align: center;
            color: #777;
            background: #fafafa;
        }

        .footer .retour-wrapper {
            margin-bottom: 15px;
        }

        .footer .copyright {
            margin-top: 10px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 28px;
            }

            th, td {
                font-size: 15px;
                padding: 12px;
            }

            .btn {
                display: block;
                margin: 8px auto;
                width: 200px;
            }

            .btn-retour {
                display: block;
                margin: 0 auto;
                width: 280px;
                padding: 14px 20px;
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            .btn-retour {
                width: 100%;
                font-size: 14px;
                padding: 12px 15px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>📚 Examens</h1>
                <p><strong>Cours :</strong>Culture Digitale</p>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Année Universitaire</th>
                            <th>Examen Normal</th>
                            <th>Examen de Rattrapage</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>2024 - 2025</td>
                            <td>
                                <a href="ressources/examens/25_26/Examen 2025.pdf" class="btn normal" download>
                                    📄 Télécharger
                                </a>
                            </td>
                            <td>
                                <a href="ressources/examens/25_26/Examen 2025 rattrapage.pdf" class="btn rattrapage" download>
                                    🔄 Télécharger
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="footer">
                <div class="retour-wrapper">
                    <a href="culture_digitale.html" class="btn-retour">
                        <i>🏠</i> Retour à la page du cours principale
                    </a>
                </div>
                <div class="copyright">
                    © 2026 - Prof. Mouhssine EL ATILLAH | Tous droits réservés
                </div>
            </div>
        </div>
    </div>
</body>
</html>
