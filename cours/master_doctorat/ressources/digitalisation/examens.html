<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Examens</title>

        <style>
            /* ==========================================================
               RÉINITIALISATION
               ========================================================== */
        
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: Segoe UI, Arial, sans-serif;
            }
        
            html {
                width: 100%;
                overflow-x: hidden;
            }
        
            body {
                width: 100%;
                max-width: 100%;
                background: #f4f6fb;
                padding: 40px;
                overflow-x: hidden;
            }
        
            /* ==========================================================
               CONTENEUR PRINCIPAL
               ========================================================== */
        
            .container {
                width: 100%;
                max-width: 1100px;
                margin: auto;
            }
        
            .card {
                width: 100%;
                background: white;
                border-radius: 15px;
                overflow: hidden;
                box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
            }
        
            /* ==========================================================
               HEADER
               ========================================================== */
        
            .header {
                background: linear-gradient(135deg, #f59e0b, #fbbf24);
                color: white;
                padding: 35px;
                text-align: center;
            }
        
            .header h1 {
                font-size: 36px;
                line-height: 1.2;
                margin-bottom: 10px;
                overflow-wrap: break-word;
            }
        
            .header p {
                opacity: .95;
                font-size: 18px;
                line-height: 1.5;
                overflow-wrap: break-word;
            }
        
            /* ==========================================================
               TABLEAU
               ========================================================== */
        
            .table-container {
                width: 100%;
                padding: 30px;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
        
            table {
                width: 100%;
                min-width: 650px;
                border-collapse: collapse;
            }
        
            th {
                background: #f59e0b;
                color: white;
                padding: 18px;
                font-size: 18px;
                white-space: nowrap;
            }
        
            td {
                padding: 18px;
                text-align: center;
                border-bottom: 1px solid #e5e7eb;
                font-size: 17px;
                vertical-align: middle;
            }
        
            tr:nth-child(even) {
                background: #fafafa;
            }
        
            tr:hover {
                background: #fff8eb;
            }
        
            /* ==========================================================
               BOUTONS DES EXAMENS
               ========================================================== */
        
            .btn {
                display: inline-block;
                padding: 10px 22px;
                border-radius: 8px;
                text-decoration: none;
                color: white;
                font-weight: 600;
                transition: .3s;
                white-space: nowrap;
            }
        
            .normal {
                background: #10b981;
            }
        
            .normal:hover {
                background: #059669;
            }
        
            .rattrapage {
                background: #ef4444;
            }
        
            .rattrapage:hover {
                background: #dc2626;
            }
        
            /* ==========================================================
               BOUTON RETOUR
               ========================================================== */
        
            .btn-retour {
                padding: 14px 35px;
                border-radius: 50px;
                text-decoration: none;
                color: white;
                font-weight: 600;
                font-size: 16px;
                transition: all .4s ease;
                display: inline-block;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
                letter-spacing: 0.5px;
                max-width: 100%;
            }
        
            .btn-retour:hover {
                transform: translateY(-3px) scale(1.02);
                box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
                background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            }
        
            .btn-retour:active {
                transform: translateY(0px) scale(0.98);
            }
        
            .btn-retour i {
                margin-right: 10px;
                font-size: 18px;
            }
        
            /* ==========================================================
               FOOTER
               ========================================================== */
        
            .footer {
                padding: 25px 20px;
                text-align: center;
                color: #777;
                background: #fafafa;
            }
        
            .footer .retour-wrapper {
                margin-bottom: 15px;
            }
        
            .footer .copyright {
                margin-top: 10px;
                font-size: 14px;
                line-height: 1.5;
            }
        
            /* ==========================================================
               TABLETTES
               ========================================================== */
        
            @media (max-width: 768px) {
        
                body {
                    padding: 20px;
                }
        
                .card {
                    border-radius: 12px;
                }
        
                /* Header */
                .header {
                    padding: 28px 20px;
                }
        
                .header h1 {
                    font-size: 28px;
                }
        
                .header p {
                    font-size: 16px;
                }
        
                /* Tableau */
                .table-container {
                    padding: 20px;
                }
        
                table {
                    min-width: 600px;
                }
        
                th,
                td {
                    font-size: 15px;
                    padding: 12px;
                }
        
                /* Boutons */
                .btn {
                    display: block;
                    margin: 8px auto;
                    width: 200px;
                    max-width: 100%;
                }
        
                .btn-retour {
                    display: block;
                    margin: 0 auto;
                    width: 280px;
                    max-width: 100%;
                    padding: 14px 20px;
                    font-size: 15px;
                }
            }
        
            /* ==========================================================
               TÉLÉPHONES
               ========================================================== */
        
            @media (max-width: 480px) {
        
                body {
                    padding: 8px;
                }
        
                .card {
                    border-radius: 10px;
                }
        
                /* Header */
                .header {
                    padding: 22px 14px;
                }
        
                .header h1 {
                    font-size: 24px;
                }
        
                .header p {
                    font-size: 14px;
                }
        
                /* Tableau */
                .table-container {
                    padding: 12px 8px;
                }
        
                /*
                   Le tableau reste suffisamment large pour être lisible.
                   Il peut défiler horizontalement sur les très petits écrans.
                */
                table {
                    min-width: 560px;
                }
        
                th {
                    font-size: 14px;
                    padding: 10px 8px;
                }
        
                td {
                    font-size: 14px;
                    padding: 10px 8px;
                }
        
                /* Boutons des examens */
                .btn {
                    width: 160px;
                    max-width: 100%;
                    padding: 9px 12px;
                    font-size: 13px;
                    margin: 6px auto;
                }
        
                /* Bouton retour */
                .btn-retour {
                    width: 100%;
                    font-size: 14px;
                    padding: 12px 15px;
                }
        
                .btn-retour i {
                    font-size: 16px;
                    margin-right: 7px;
                }
        
                /* Footer */
                .footer {
                    padding: 20px 12px;
                }
        
                .footer .copyright {
                    font-size: 12px;
                }
            }
        
            /* ==========================================================
               TRÈS PETITS TÉLÉPHONES
               ========================================================== */
        
            @media (max-width: 360px) {
        
                body {
                    padding: 4px;
                }
        
                .header {
                    padding: 18px 10px;
                }
        
                .header h1 {
                    font-size: 21px;
                }
        
                .header p {
                    font-size: 13px;
                }
        
                .table-container {
                    padding: 8px 5px;
                }
        
                table {
                    min-width: 520px;
                }
        
                th,
                td {
                    font-size: 13px;
                    padding: 8px 6px;
                }
        
                .btn {
                    width: 145px;
                    font-size: 12px;
                    padding: 8px 10px;
                }
        
                .btn-retour {
                    font-size: 13px;
                    padding: 11px 10px;
                }
            }
        </style>
</head>

                <div class="copyright">

            </div>
        </div>
    </div>
</body>
